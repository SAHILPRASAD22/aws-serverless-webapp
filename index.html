<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Serverless App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #ff9900;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e68a00;
        }

        #result {
            margin-top: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AWS Serverless App</h1>

        <p>Click the button to store data in DynamoDB.</p>

        <button onclick="saveData()">Save Data</button>

        <div id="result"></div>

    </div>

    <script>

        async function saveData() {

            const result = document.getElementById("result");

            result.innerText = "Saving...";

            try {

                const response = await fetch(
                    "https://mdl3x5haud.execute-api.us-east-1.amazonaws.com/data",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({})
                    }
                );

                const data = await response.json();

                result.innerText =
                    "Success! ID: " + data.id;

            } catch (error) {

                result.innerText =
                    "Error: " + error.message;

            }
        }

    </script>

</body>
</html>
